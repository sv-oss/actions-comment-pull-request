name: notify-compatibility-mirror
on:
  push:
    branches:
      - main
    tags:
      - "*"
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'sv-oss/actions-comment-pull-request'
    steps:
      - name: Request mirror update
        env:
          TOKEN: ${{ secrets.SERVICE_VICTORIA_DISPATCH_TOKEN }}
        run: |-
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/service-victoria/actions-comment-pull-request/dispatches \
            --data '{"event_type":"sync-from-sv-oss"}'
